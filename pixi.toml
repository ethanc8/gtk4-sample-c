[workspace]
authors = ["ethanc8 <echaroenpitaks@gmail.com>"]
channels = ["conda-forge"]
name = "gtk4-sample-c"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
configure = "meson setup _build"
build = { cmd = "meson compile -C _build", depends-on = ["configure"] }
run = "_build/src/gtk4-sample-c"
clean = "rm -rf _build"

package = "pixi build --no-incremental"

[dependencies]
c-compiler = "*"
meson = ">=1.9.0,<2"
ninja = ">=1.13.1,<2"

gtk4 = ">=4.14.1,<5"
glib = ">=2.86.0,<3"
glib-tools = ">=2.86.0,<3"
gobject-introspection = ">=1.84.0,<2"
zlib = ">=1.3.1,<2"
expat = ">=2.7.1,<3"
adwaita-icon-theme = ">=48.1,<49"

xorg-xproto = ">=7.0.31,<8"
xorg-kbproto = ">=1.0.7,<2"
xorg-xextproto = ">=7.3.0,<8"
xorg-renderproto = ">=0.11.1,<0.12"

[package]
name = "gtk4-sample-c"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.3.*" }

[feature.conda.dependencies]
gtk4-sample-c = { path = "." }

[feature.conda.tasks]
run-package = "gtk4-sample-c"

[environments]
conda = ["conda"]
