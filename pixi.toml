[workspace]
authors = ["ethanc8 <echaroenpitaks@gmail.com>"]
channels = ["conda-forge"]
name = "gtk4-sample-c"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
configure = "meson setup _build"
build = {cmd = "meson compile -C _build", depends-on = ["configure"] }
run = "_build/src/gtk4-sample-c"
clean = "rm -rf _build"

[dependencies]
c-compiler = "*"
gtk4 = ">=4.14.1,<5"
meson = ">=1.9.0,<2"
ninja = ">=1.13.1,<2"
gobject-introspection = ">=1.84.0,<2"
zlib = ">=1.3.1,<2"
expat = ">=2.7.1,<3"

[package]
name = "gtk4-sample-c"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.3.*" }


